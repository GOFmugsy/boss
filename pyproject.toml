[project]
name = "boss-notes"
version = "0.1.0"
description = "A keyboard-driven terminal app for managers to keep performance notes on their team"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=3.0",
]

[project.optional-dependencies]
images = ["textual-image>=0.8"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
boss = "boss.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["boss*"]

[tool.setuptools.package-data]
boss = ["*.tcss", "*.zsh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
